name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Rebuild high resolution transparent Bloom logo
        run: |
          cat .build/bloom-logo/part-*.txt | tr -d '\n' | base64 --decode > assets/site/bloom-logo.webp
          python3 - <<'PY'
          from pathlib import Path
          data = Path("assets/site/bloom-logo.webp").read_bytes()
          assert data[:4] == b"RIFF" and data[8:12] == b"WEBP", "Bloom logo is not a valid WebP"
          assert data[12:16] == b"VP8X", "Bloom logo is missing its extended WebP header"
          width = int.from_bytes(data[24:27], "little") + 1
          height = int.from_bytes(data[27:30], "little") + 1
          assert (width, height) == (397, 415), f"Unexpected Bloom logo size: {width}x{height}"
          assert data[20] & 0x10, "Bloom logo has no alpha channel"
          print(f"Verified transparent Bloom logo: {width}x{height}, {len(data)} bytes")
          PY
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait for Pages artifact indexing
        run: sleep 15
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
